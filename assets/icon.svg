<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon source of truth. PNGs in this folder are rendered from it
       (assets/icon-180/192/512.png). Full-bleed square: iOS rounds the
       corners itself and Android masks it, so no baked-in corner radius. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2f52"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- rolling course line -->
  <path d="M-10 396 C90 330 170 372 256 336 C342 300 430 322 522 268"
        stroke="#3d8bfd" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M-10 428 C90 362 170 404 256 368 C342 332 430 354 522 300"
        stroke="#2a4f86" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.7"/>
  <text x="256" y="278" font-family="Arial, Helvetica, sans-serif" font-size="196"
        font-weight="800" fill="#e6ebf2" text-anchor="middle" letter-spacing="-6">XC</text>
</svg>
